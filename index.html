<script>
const API='https://api.sleeper.app/v1',FC='https://api.fantasycalc.com/values/current',SP='https://api.sleeper.com',ESPN='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const j=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0),fmt=n=>n?Math.round(n).toLocaleString('en-US'):'–';
const sg=n=>n>0?'+'+fmt(n):n<0?'−'+fmt(-n):'0';
const POS=['QB','RB','WR','TE'];
const CL={QB:'#ff2a6d',RB:'#00ceb8',WR:'#ff9ad5',TE:'#ffae58',FLX:'#c4a1ff',SF:'#ff2a6d',BN:'#d9a3c0'};
const IC={Questionable:'#c9971c',Doubtful:'#e07b24',Out:'#e5484d',IR:'#e5484d',PUP:'#e5484d',Sus:'#9b59b6',DNR:'#e5484d',NA:'#a0708a'};
const IA={Questionable:'Q',Doubtful:'D',Out:'O',IR:'IR',PUP:'PUP',Sus:'SUS',DNR:'DNR',NA:'NA'};
const MODES={rebuild:'Rebuilding',fringe:'Fringe',contender:'Contender'};
let S=ls.get('cfg',{}),D=S.leagueId?ls.get('data_'+S.leagueId,null):null,PL=ls.get('pl',{ts:0,m:{}}).m,MU=ls.get('mu',null),tab='roster',filt='ALL',q='',status='',lastRun=0,INJS='new';
let POOL=[],POOLKEY='',PAGE=[],NC=null,TGP=[];const shown=new Set();
const TB={view:'sug',p:'',give:new Set(),get:new Set()},TG={q:'',id:''};
const LV={view:'m',sb:null,mu:null,wk:null,open:new Set(),game:null,plays:null,ts:0,err:''};
const resetTB=()=>{TB.p='';TB.give.clear();TB.get.clear();TG.q='';TG.id='';POOLKEY='';NC=null};
const soft=()=>{const a=document.activeElement;if(a&&['INPUT','SELECT'].includes(a.tagName))return;render()};

const mk=(id,vals=D?.vals)=>{const v=vals?.[id],o=PL[id]||{};return{id,name:v?.n||o.n||id,pos:v?.p||o.p||'?',team:o.t||v?.t||'FA',age:v?.a||o.a,v:v?.v||0,r:v?.r,inj:o.inj,body:o.body,note:o.note,nu:o.nu,num:o.num,ht:o.ht,wt:o.wt,col:o.col,exp:o.exp,st:o.st,dco:o.dco}};

/* ---------- expected points ---------- */
function xp(p){if(!MU||p.isPick)return null;const r=MU.proj?.[p.id];if(!r)return null;const f=MU.F?.[r.o]?.[p.pos]||1,a=Math.min(1.1,Math.max(.9,1+(f-1)*.5));return{pts:r.p*a,base:r.p,o:r.o,f}}
const xps=p=>{const x=xp(p);return x?`<div class="sub" style="font-weight:600">${x.pts.toFixed(1)} pts vs ${x.o}${x.f>=1.05?' ▲':x.f<=.95?' ▼':''}</div>`:''};
async function loadMU(season,week,ppr){
  if(MU&&MU.season===season&&MU.week===week&&MU.ppr===ppr&&Date.now()-MU.ts<108e5)return MU;
  const qs='season_type=regular&position[]=QB&position[]=RB&position[]=WR&position[]=TE';
  const pk=ppr>=1?'pts_ppr':ppr>=.5?'pts_half_ppr':'pts_std',proj={};
  try{const r=await j(`${SP}/projections/nfl/${season}/${week}?${qs}`);r.forEach(x=>{const v=x.stats?.[pk];if(x.player_id&&v!=null&&x.opponent)proj[x.player_id]={p:v,o:x.opponent}})}catch(e){}
  let al=ls.get('allow',null);if(!al||al.season!==season)al={season,done:[],A:{},G:{}};
  const posOf=id=>PL[id]?.p||D?.vals?.[id]?.p;
  for(let w=1;w<week;w++){
    if(al.done.includes(w))continue;
    try{const r=await j(`${SP}/stats/nfl/${season}/${w}?${qs}`),seen={};
      r.forEach(x=>{const pos=posOf(x.player_id),o=x.opponent,pts=x.stats?.pts_ppr;if(!pos||!o||pts==null)return;(al.A[o]=al.A[o]||{})[pos]=((al.A[o]||{})[pos]||0)+pts;seen[o]=1});
      Object.keys(seen).forEach(o=>al.G[o]=(al.G[o]||0)+1);al.done.push(w);ls.set('allow',al)}catch(e){break}
  }
  const F={};
  if(al.done.length>=2)POS.forEach(k=>{const pg={};Object.keys(al.A).forEach(o=>{if(al.G[o])pg[o]=(al.A[o][k]||0)/al.G[o]});const vs=Object.values(pg),avg=sum(vs)/Math.max(vs.length,1);if(avg)Object.keys(pg).forEach(o=>{(F[o]=F[o]||{})[k]=pg[o]/avg})});
  MU={season,week,ppr,proj,F,ts:Date.now(),n:al.done.length};ls.set('mu',MU);return MU;
}

/* ---------- engine ---------- */
function lineup(pl,SL){
  const by={QB:[],RB:[],WR:[],TE:[]},rest={};let s=0;
  pl.forEach(p=>by[p.pos]&&by[p.pos].push(p.v));
  for(const k of POS){by[k].sort((a,b)=>b-a);s+=sum(by[k].slice(0,SL[k]));rest[k]=by[k].slice(SL[k])}
  const fl=[...rest.RB,...rest.WR,...rest.TE].sort((a,b)=>b-a);
  s+=sum(fl.slice(0,SL.FLEX));
  const left=[...fl.slice(SL.FLEX),...rest.QB].sort((a,b)=>b-a);
  return s+sum(left.slice(0,SL.SF));
}
function assign(pl,SL){
  const so=[...pl].sort((a,b)=>b.v-a.v),used=new Set(),rows=[];
  const take=(ps,n,l)=>{for(let i=0;i<n;i++){const p=so.find(x=>ps.includes(x.pos)&&!used.has(x.id));if(p)used.add(p.id);rows.push({s:l,p})}};
  take(['QB'],SL.QB,'QB');take(['RB'],SL.RB,'RB');take(['WR'],SL.WR,'WR');take(['TE'],SL.TE,'TE');take(['RB','WR','TE'],SL.FLEX,'FLX');take(POS,SL.SF,'SF');
  return{rows,bench:so.filter(x=>!used.has(x.id))};
}
function computeNeeds(){
  if(NC&&NC.ts===D.ts)return NC;
  const SL=D.slots,N=D.teams.length,t3=Math.max(1,Math.ceil(N/3)),R={};
  D.teams.forEach(t=>R[t.rid]={pos:{},sur:{}});
  const lu=D.teams.map(t=>lineup(t.players,SL));
  POS.forEach(k=>{
    const n=Math.max(1,SL[k]+(k==='QB'?SL.SF:Math.round(SL.FLEX/3)));
    const sc=D.teams.map(t=>sum(t.players.filter(p=>p.pos===k).map(p=>p.v).sort((a,b)=>b-a).slice(0,n)));
    const mx=Math.max(...sc,1);
    D.teams.forEach((t,i)=>{
      const rank=sc.filter(x=>x>sc[i]).length+1,lv=rank<=t3?0:rank>N-t3?2:1;
      R[t.rid].pos[k]={k,rank,mine:sc[i],max:mx,lv,lab:['Strength','Average','Need'][lv]};
      const bench=t.players.filter(p=>p.pos===k).map(p=>p.v).sort((a,b)=>b-a).slice(n);
      R[t.rid].sur[k]=(bench[0]||0)>=1200;
    });
  });
  D.teams.forEach((t,i)=>{const r=lu.filter(x=>x>lu[i]).length+1;R[t.rid].win=r<=t3?'Contender':r>N-t3?'Rebuilding':'Fringe'});
  NC={ts:D.ts,R};return NC;
}
function needs(){const me=D.teams.find(t=>t.mine),r=computeNeeds().R[me.rid];return POS.map(k=>r.pos[k])}
function pool(){
  const me=D.teams.find(t=>t.mine);if(!me)return[];
  const SL=D.slots,base=lineup(me.players,SL),mode=S.mode||'fringe',out=[],NR=computeNeeds().R,mR=NR[me.rid];
  const mw={contender:1.5,fringe:1,rebuild:.3}[mode];
  const A=t=>[...t.players,...t.picks].filter(p=>p.v>=400),mine=A(me);
  for(const t of D.teams){
    if(t.mine)continue;
    const tR=NR[t.rid],tb=lineup(t.players,SL),theirs=A(t),found=[];
    const test=(give,b)=>{
      const vs=give.map(p=>p.v).sort((x,y)=>y-x),gv=vs[0]+(vs[1]?0.6*vs[1]:0),ratio=b.v/gv;
      if(ratio<0.9||ratio>1.06)return;
      if(mode==='contender'&&b.isPick)return;
      const gp=give.filter(p=>!p.isPick),ids=gp.map(p=>p.id);
      const mn=lineup([...me.players.filter(p=>!ids.includes(p.id)),...(b.isPick?[]:[b])],SL)-base;
      const tn=lineup([...t.players.filter(p=>p.id!==b.id),...gp],SL)-tb;
      const ga=sum(give.map(p=>p.age||26))/give.length,ba=b.age||26,young=ga-ba;
      const pin=b.isPick?1:0,pout=give.length-gp.length;
      let ok,score;
      if(mode==='contender'){ok=mn>0&&(tn>0||pout>0);score=mn+0.3*Math.max(tn,0)+150*pout}
      else if(mode==='rebuild'){ok=young>=2&&tn>0;score=150*young+500*pin+0.3*tn}
      else{ok=mn>=0&&tn>0&&(mn>0||young>=2);score=mn+0.5*tn+80*young}
      if(!ok)return;
      const tp=gp.reduce((a,p)=>!a||tR.pos[p.pos].lv>tR.pos[a.pos].lv?p:a,null);
      const myLv=b.isPick?0:mR.pos[b.pos].lv,thLv=tp?tR.pos[tp.pos].lv:0;
      const spareB=!b.isPick&&tR.sur[b.pos],spareG=gp.some(p=>mR.sur[p.pos]);
      let ac=(tn>0?2:0)+thLv+(spareB?1:0)+(ratio<=1?1:0);
      if(tR.win==='Rebuilding'&&(pout>0||ga<ba))ac++;
      if(tR.win==='Contender'&&ga>=ba)ac++;
      score+=120*mw*myLv+120*thLv+60*(spareB?1:0)+60*(spareG?1:0)+100*ac;
      found.push({t,give,get:b,ratio,mn,tn,ga,ba,score,ac,tp:tp?tp.pos:null,spareB,spareG,tw:tR.win,k:give.map(p=>p.id).join('+')+'>'+b.id});
    };
    for(const b of theirs)for(let i=0;i<mine.length;i++){test([mine[i]],b);for(let k=i+1;k<mine.length;k++)test([mine[i],mine[k]],b)}
    found.sort((a,b)=>b.score-a.score);
    const seen=new Set();
    for(const f of found){if(seen.has(f.get.id))continue;seen.add(f.get.id);out.push(f);if(seen.size>=5)break}
  }
  return out.sort((a,b)=>b.score-a.score);
}
function take(){
  let rest=POOL.filter(r=>!shown.has(r.k));
  if(rest.length<4){shown.clear();rest=POOL}
  PAGE=rest.slice(0,8);PAGE.forEach(r=>shown.add(r.k));
}

/* ---------- target a player ---------- */
const WT=[1,.65,.45,.35,.3,.25,.2];
const adj=a=>[...a].map(p=>p.v).sort((x,y)=>y-x).reduce((s,v,i)=>s+v*(WT[i]??.2),0);
const assetsOf=t=>[...t.players,...t.picks].sort((a,b)=>b.v-a.v);
function targetPlan(me,pt,b){
  const SL=D.slots,NR=computeNeeds().R,mode=S.mode||'fringe',tR=NR[pt.rid],mR=NR[me.rid];
  const baseM=lineup(me.players,SL),baseT=lineup(pt.players,SL),res=[];
  const assets=assetsOf(me).filter(p=>p.v>=150&&p.v<=b.v*1.25).slice(0,30);
  const wl=mode==='contender'?1.2:mode==='fringe'?.8:.3;
  const test=give=>{
    const gv=adj(give),ratio=gv/Math.max(b.v,1);
    if(ratio<.93||ratio>1.22)return;
    const gp=give.filter(p=>!p.isPick),ids=gp.map(p=>p.id);
    const mn=lineup([...me.players.filter(p=>!ids.includes(p.id)),b],SL)-baseM;
    const tn=lineup([...pt.players.filter(p=>p.id!==b.id),...gp],SL)-baseT;
    const needPos=[...new Set(gp.filter(p=>tR.pos[p.pos].lv===2).map(p=>p.pos))];
    const spare=gp.filter(p=>mR.sur[p.pos]).length,pk=give.length-gp.length;
    const ga=gp.length?sum(gp.map(p=>p.age||26))/gp.length:null;
    let s=300*Math.max(0,1-Math.abs(ratio-1.04)*3)+0.5*tn+(mn>=0?mn:mn*wl)+200*needPos.length+80*spare;
    if(mode==='contender')s+=60*pk;else if(mode==='rebuild')s+=(ga?(ga-(b.age||26))*40:0)-120*pk;
    res.push({give,ratio,mn,tn,needPos,spare,s});
  };
  assets.forEach((a,i)=>{test([a]);for(let k=i+1;k<assets.length;k++)test([a,assets[k]])});
  res.sort((x,y)=>y.s-x.s);
  const out=[],cnt={};
  for(const r of res){const key=r.give[0].id;if((cnt[key]||0)>=2)continue;cnt[key]=(cnt[key]||0)+1;out.push(r);if(out.length>=5)break}
  return out;
}
function planHTML(me,pt,b){
  const plans=targetPlan(me,pt,b);TGP=plans;
  const NR=computeNeeds().R,tR=NR[pt.rid],N=D.teams.length,nl=POS.filter(k=>tR.pos[k].lv===2),sp=POS.filter(k=>tR.sur[k]);
  let h=`<div class="sec">Target</div><div class="card">${prow(b)}<div class="row" style="min-height:48px;border:0">${tav(pt)}<div class="grow"><div class="nm">${esc(pt.name)}</div><div class="sub">${tR.win} · Needs: ${nl.join(', ')||'none'} · Spare: ${sp.join(', ')||'none'}</div></div></div></div><div class="sec">What to offer</div>`;
  if(!plans.length)return h+'<div class="card pad">No fair packages found from your assets. Try another target or strategy.</div>';
  return h+plans.map((r,i)=>{
    const lab=r.ratio>=1.15?['Slight overpay','warn']:r.ratio>=1?['Fair, likely accepted','good']:['Slightly light','warn'];

          for(const i in m){const o=pl.m[i];if(o&&(o.inj||'')!==(m[i].inj||''))log.unshift({id:i,n:m[i].n,f:o.inj||'Healthy',to:m[i].inj||'Healthy',b:m[i].body,t:Date.now()})}
          ls.set('injlog',log.slice(0,80))}
        pl.ts=Date.now();pl.m=m;ls.set('pl',pl)}catch(e){}
    }
    PL=pl.m;
    const R=lg.settings?.draft_rounds||4,start=+lg.season+(dr.some(d=>+d.season===+lg.season&&d.status!=='complete')?0:1),years=[start,start+1,start+2];
    const mx=Math.max(...Object.values(vals).map(v=>v.v),1),base=[3800,1700,800,450,300,250,200,150];
    const pickV=(y,r)=>pk[y+'-'+r]??(base[r-1]||120)*(mx/10000)*[1,.92,.85][y-start];
    const rname={};ro.forEach(r=>{const u=us.find(u=>u.user_id===r.owner_id);rname[r.roster_id]=u?.metadata?.team_name||u?.display_name||'Team '+r.roster_id});
    const own={};ro.forEach(r=>years.forEach(y=>{for(let rd=1;rd<=R;rd++)own[`${y}-${rd}-${r.roster_id}`]=r.roster_id}));
    (tp||[]).forEach(t=>{const k=`${t.season}-${t.round}-${t.roster_id}`;if(k in own)own[k]=t.owner_id});
    const teams=ro.map(r=>{const u=us.find(u=>u.user_id===r.owner_id);
      const picks=Object.entries(own).filter(([k,o])=>o===r.roster_id).map(([k])=>{const [y,rd,orig]=k.split('-');
        return{id:'pk'+k,name:`${y} Round ${rd}${+orig!==r.roster_id?` (via ${rname[orig]})`:''}`,pos:'PICK',team:'',v:pickV(+y,+rd),isPick:true,round:+rd,year:+y,age:21}}).sort((a,b)=>b.v-a.v);
      const avatar=u?.metadata?.avatar||(u?.avatar?`https://sleepercdn.com/avatars/thumbs/${u.avatar}`:'');
      return{rid:r.roster_id,name:rname[r.roster_id],av:avatar,mine:r.owner_id===S.userId,picks,
        players:(r.players||[]).map(i=>mk(i,vals)).filter(p=>POS.includes(p.pos))}});
    const gp=[];years.forEach(y=>{for(let rd=1;rd<=R;rd++)gp.push({id:'g'+y+rd,name:`${y} Round ${rd}`,v:pickV(y,rd),isPick:true,round:rd,pos:'PICK'})});
    const nd={teams,vals,pk,gp,lname:lg.name,lav:lg.avatar,sf,ppr,ts:Date.now(),vs:{dyn,sf,ppr,tep,ptd,n:ro.length},
      slots:{QB:c('QB'),RB:c('RB'),WR:c('WR'),TE:c('TE'),FLEX:c('FLEX')+c('REC_FLEX'),SF:c('SUPER_FLEX')}};
    ls.set('data_'+lid,nd);
    if(lid===S.leagueId){D=nd;NC=null;POOLKEY='';status=fresh?'Updated just now':'Rosters updated · values offline';
      const ok=new Set(teams.flatMap(t=>[...t.players,...t.picks].map(p=>p.id)));
      [TB.give,TB.get].forEach(s=>[...s].forEach(i=>{if(!ok.has(i))s.delete(i)}));
      if(st&&st.season_type==='regular'&&+st.week>0)loadMU(String(st.season),+st.week,ppr).then(()=>{if(S.leagueId===lid)soft()}).catch(()=>{});
    }
  }catch(e){status='Offline · showing saved data'}
  paintStatus();if(D)soft();
}

  <div class="sec">${esc(p.team)} lineup</div><div class="card">${lu}</div>`;
  m.style.display='block';m.scrollTop=0;document.body.style.overflow='hidden';

  if(e.target.closest('#injr')){refresh(true);return}
  if(e.target.closest('#newt')){take();render();scrollTo(0,0);return}
