</style></head><body>
<div id="bg"></div>
<div id="app"></div>
<nav id="nav" style="display:none"></nav>
<div id="modal"></div>
<script>
const API='https://api.sleeper.app/v1',FC='https://api.fantasycalc.com/values/current';
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const j=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0),fmt=n=>n?Math.round(n).toLocaleString('en-US'):'–';
const POS=['QB','RB','WR','TE'];
const CL={QB:'#ff2a6d',RB:'#00ceb8',WR:'#58a7ff',TE:'#ffae58',FLX:'#a78bfa',SF:'#ff2a6d',BN:'#7b87a8'};
const IC={Questionable:'#c9971c',Doubtful:'#e07b24',Out:'#e5484d',IR:'#e5484d',PUP:'#e5484d',Sus:'#9b59b6',DNR:'#e5484d',NA:'#7b87a8'};
const IA={Questionable:'Q',Doubtful:'D',Out:'O',IR:'IR',PUP:'PUP',Sus:'SUS',DNR:'DNR',NA:'NA'};
const MODES={rebuild:'Rebuilding',fringe:'Fringe',contender:'Contender'};
let S=ls.get('cfg',{}),D=ls.get('data',null),PL=ls.get('pl',{ts:0,m:{}}).m,tab='roster',filt='ALL',q='',status='',lastRun=0;
let POOL=[],POOLKEY='',PAGE=[];const shown=new Set();

const mk=(id,vals=D?.vals)=>{const v=vals?.[id],o=PL[id]||{};return{id,name:v?.n||o.n||id,pos:v?.p||o.p||'?',team:o.t||v?.t||'FA',age:v?.a||o.a,v:v?.v||0,r:v?.r,inj:o.inj,body:o.body,note:o.note,num:o.num,ht:o.ht,wt:o.wt,col:o.col,exp:o.exp,st:o.st,dco:o.dco}};

/* ---------- engine ---------- */
function lineup(pl,SL){
  const by={QB:[],RB:[],WR:[],TE:[]},rest={};let s=0;
  pl.forEach(p=>by[p.pos]&&by[p.pos].push(p.v));
  for(const k of POS){by[k].sort((a,b)=>b-a);s+=sum(by[k].slice(0,SL[k]));rest[k]=by[k].slice(SL[k])}
  const fl=[...rest.RB,...rest.WR,...rest.TE].sort((a,b)=>b-a);
  s+=sum(fl.slice(0,SL.FLEX));
  const left=[...fl.slice(SL.FLEX),...rest.QB].sort((a,b)=>b-a);
  return s+sum(left.slice(0,SL.SF));
}
function assign(pl,SL){
  const so=[...pl].sort((a,b)=>b.v-a.v),used=new Set(),rows=[];
  const take=(ps,n,l)=>{for(let i=0;i<n;i++){const p=so.find(x=>ps.includes(x.pos)&&!used.has(x.id));if(p)used.add(p.id);rows.push({s:l,p})}};
  take(['QB'],SL.QB,'QB');take(['RB'],SL.RB,'RB');take(['WR'],SL.WR,'WR');take(['TE'],SL.TE,'TE');take(['RB','WR','TE'],SL.FLEX,'FLX');take(POS,SL.SF,'SF');
  return{rows,bench:so.filter(x=>!used.has(x.id))};
}
function needs(){
  const SL=D.slots,N=D.teams.length,t3=Math.ceil(N/3),me=D.teams.find(t=>t.mine);
  return POS.map(k=>{
    const n=Math.max(1,SL[k]+(k==='QB'?SL.SF:Math.round(SL.FLEX/3)));
    const sc=t=>sum(t.players.filter(p=>p.pos===k).map(p=>p.v).sort((a,b)=>b-a).slice(0,n));
    const all=D.teams.map(sc),mine=sc(me),rank=all.filter(x=>x>mine).length+1;
    return{k,rank,mine,max:Math.max(...all,1),lab:rank<=t3?'Strength':rank>N-t3?'Need':'Average'};
  });
}
function pool(){
  const me=D.teams.find(t=>t.mine);if(!me)return[];
  const SL=D.slots,base=lineup(me.players,SL),mode=S.mode||'fringe',out=[];
  const A=t=>[...t.players,...t.picks].filter(p=>p.v>=400),mine=A(me);
  for(const t of D.teams){
    if(t.mine)continue;
    const tb=lineup(t.players,SL),theirs=A(t),found=[];
    const test=(give,b)=>{
      const vs=give.map(p=>p.v).sort((x,y)=>y-x),gv=vs[0]+(vs[1]?0.6*vs[1]:0),ratio=b.v/gv;
      if(ratio<0.9||ratio>1.06)return;
      if(mode==='contender'&&b.isPick)return;
      const gp=give.filter(p=>!p.isPick),ids=gp.map(p=>p.id);
      const mn=lineup([...me.players.filter(p=>!ids.includes(p.id)),...(b.isPick?[]:[b])],SL)-base;
      const tn=lineup([...t.players.filter(p=>p.id!==b.id),...gp],SL)-tb;
      const ga=sum(give.map(p=>p.age||26))/give.length,ba=b.age||26,young=ga-ba;
      const pin=b.isPick?1:0,pout=give.length-gp.length;
      let ok,score;
      if(mode==='contender'){ok=mn>0&&(tn>0||pout>0);score=mn+0.3*Math.max(tn,0)+150*pout}
      else if(mode==='rebuild'){ok=young>=2&&tn>0;score=150*young+500*pin+0.3*tn}
      else{ok=mn>=0&&tn>0&&(mn>0||young>=2);score=mn+0.5*tn+80*young}
      if(ok)found.push({t,give,get:b,ratio,mn,tn,ga,ba,score,k:give.map(p=>p.id).join('+')+'>'+b.id});
    };
    for(const b of theirs)for(let i=0;i<mine.length;i++){test([mine[i]],b);for(let k=i+1;k<mine.length;k++)test([mine[i],mine[k]],b)}
    found.sort((a,b)=>b.score-a.score);
    const seen=new Set();
    for(const f of found){if(seen.has(f.get.id))continue;seen.add(f.get.id);out.push(f);if(seen.size>=5)break}
  }
  return out.sort((a,b)=>b.score-a.score);
}
function take(){
  let rest=POOL.filter(r=>!shown.has(r.k));
  if(rest.length<4){shown.clear();rest=POOL}
  PAGE=rest.slice(0,8);PAGE.forEach(r=>shown.add(r.k));
}

/* ---------- refresh ---------- */
async function refresh(){
  if(!S.leagueId)return;
  lastRun=Date.now();status='Updating…';paintStatus();
  try{
    const [lg,ro,us,tp,dr]=await Promise.all([j(`${API}/league/${S.leagueId}`),j(`${API}/league/${S.leagueId}/rosters`),j(`${API}/league/${S.leagueId}/users`),j(`${API}/league/${S.leagueId}/traded_picks`).catch(()=>[]),j(`${API}/league/${S.leagueId}/drafts`).catch(()=>[])]);
    const rp=lg.roster_positions||[],c=k=>rp.filter(x=>x===k).length;
    const sf=c('SUPER_FLEX')>0||c('QB')>1,ppr=lg.scoring_settings?.rec??1;
    let vals=D?.vals||{},pk=D?.pk||{},fresh=false;
    try{
      const raw=await j(`${FC}?isDynasty=true&numQbs=${sf?2:1}&numTeams=${ro.length}&ppr=${ppr}`);
      vals={};const pt={};
      raw.forEach(x=>{const p=x.player||{},nm=p.name||'';
        if(p.position==='PICK'){const y=nm.match(/20\d\d/),r=nm.match(/\b(\d)\.\d\d\b/)||nm.match(/(\d)(?:st|nd|rd|th)/);if(y&&r){const k=y[0]+'-'+r[1];(pt[k]=pt[k]||[]).push(x.value)}}
        else if(p.sleeperId)vals[p.sleeperId]={n:nm,p:p.position,a:p.maybeAge,t:p.maybeTeam,v:x.value,r:x.overallRank}});
      pk={};for(const k in pt)pk[k]=sum(pt[k])/pt[k].length;fresh=true;
    }catch(e){}
    const ids=new Set(ro.flatMap(r=>r.players||[])),pl=ls.get('pl',{ts:0,m:{}});
    if(Date.now()-pl.ts>216e5){
      try{const all=await j(API+'/players/nfl'),m={};
        for(const i in all){const p=all[i];if(!(ids.has(i)||(p.team&&POS.includes(p.position)&&(p.depth_chart_order!=null||p.status==='Active'))))continue;
          m[i]={n:p.full_name||`${p.first_name} ${p.last_name}`,p:p.position,t:p.team||'FA',a:p.age,num:p.number,ht:p.height,wt:p.weight,col:p.college,exp:p.years_exp,inj:p.injury_status,body:p.injury_body_part,note:p.injury_notes,st:p.status,dco:p.depth_chart_order}}
        pl.ts=Date.now();pl.m=m;ls.set('pl',pl)}catch(e){}
    }
    PL=pl.m;
    const R=lg.settings?.draft_rounds||4,start=+lg.season+(dr.some(d=>+d.season===+lg.season&&d.status!=='complete')?0:1),years=[start,start+1,start+2];
    const mx=Math.max(...Object.values(vals).map(v=>v.v),1),base=[3800,1700,800,450,300,250,200,150];
    const pickV=(y,r)=>pk[y+'-'+r]??(base[r-1]||120)*(mx/10000)*[1,.92,.85][y-start];
    const rname={};ro.forEach(r=>{const u=us.find(u=>u.user_id===r.owner_id);rname[r.roster_id]=u?.metadata?.team_name||u?.display_name||'Team '+r.roster_id});
    const own={};ro.forEach(r=>years.forEach(y=>{for(let rd=1;rd<=R;rd++)own[`${y}-${rd}-${r.roster_id}`]=r.roster_id}));
    (tp||[]).forEach(t=>{const k=`${t.season}-${t.round}-${t.roster_id}`;if(k in own)own[k]=t.owner_id});
    const teams=ro.map(r=>{const u=us.find(u=>u.user_id===r.owner_id);
      const picks=Object.entries(own).filter(([k,o])=>o===r.roster_id).map(([k])=>{const [y,rd,orig]=k.split('-');
        return{id:'pk'+k,name:`${y} Round ${rd}${+orig!==r.roster_id?` (via ${rname[orig]})`:''}`,pos:'PICK',team:'',v:pickV(+y,+rd),isPick:true,round:+rd,year:+y,age:21}}).sort((a,b)=>b.v-a.v);
      const avatar=u?.metadata?.avatar||(u?.avatar?`https://sleepercdn.com/avatars/thumbs/${u.avatar}`:'');
      return{rid:r.roster_id,name:rname[r.roster_id],av:avatar,mine:r.owner_id===S.userId,picks,
        players:(r.players||[]).map(i=>mk(i,vals)).filter(p=>POS.includes(p.pos))}});
    const gp=[];years.forEach(y=>{for(let rd=1;rd<=R;rd++)gp.push({id:'g'+y+rd,name:`${y} Round ${rd}`,v:pickV(y,rd),isPick:true,round:rd,pos:'PICK'})});
    D={teams,vals,pk,gp,lname:lg.name,lav:lg.avatar,sf,ppr,ts:Date.now(),
      slots:{QB:c('QB'),RB:c('RB'),WR:c('WR'),TE:c('TE'),FLEX:c('FLEX')+c('REC_FLEX'),SF:c('SUPER_FLEX')}};
    ls.set('data',D);status=fresh?'Updated just now':'Rosters updated · values offline';
  }catch(e){status='Offline · showing saved data'}
  paintStatus();if(D)render();
}
function paintStatus(){const el=$('#st');if(el)el.textContent=status}

/* ---------- setup ---------- */
function setup(msg=''){
  $('#nav').style.display='none';
  $('#app').innerHTML=`<div class="hd"><div><h1>Dynasty Dudes</h1><div class="sub">Connect your Sleeper account</div></div></div>
  <div class="card pad"><input style="width:100%;margin:0" id="un" placeholder="Sleeper username" autocapitalize="off" autocorrect="off" value="${esc(S.username||'')}">
  <button class="btn" id="go">Find my leagues</button><div class="warn" id="msg" style="margin-top:8px">${msg}</div></div><div id="lgs"></div>`;
  $('#go').onclick=async()=>{
    const name=$('#un').value.trim();if(!name)return;$('#msg').textContent='Looking up…';
    try{
      const u=await j(`${API}/user/${encodeURIComponent(name)}`);if(!u)throw Error();
      const season=(await j(API+'/state/nfl')).season,lgs=await j(`${API}/user/${u.user_id}/leagues/nfl/${season}`);
      $('#msg').textContent=lgs.length?'':'No leagues found for this season.';
      $('#lgs').innerHTML='<div class="sec">Choose a league</div>'+lgs.map((l,i)=>`<div class="card pad" data-i="${i}"><div class="nm">${esc(l.name)}</div><div class="sub">${l.total_rosters} teams</div></div>`).join('');
      document.querySelectorAll('#lgs .card').forEach(el=>el.onclick=()=>{
        const l=lgs[el.dataset.i];S={username:name,userId:u.user_id,leagueId:l.league_id,mode:S.mode||'fringe'};ls.set('cfg',S);D=null;
        $('#app').innerHTML='<div class="sub" style="padding:30px 16px">Loading league…</div>';refresh();
      });
    }catch(e){$('#msg').textContent='Couldn’t find that username.'}
  };
}

/* ---------- components ---------- */
const av=(id,big)=>`<span class="av ${big?'big':''}"><img src="https://sleepercdn.com/content/nfl/players/thumb/${id}.jpg" onerror="this.style.visibility='hidden'" loading="lazy" alt=""></span>`;
const tav=t=>`<span class="av tv">${esc((t.name||'?')[0].toUpperCase())}${t.av&&/^https?:/.test(t.av)?`<img src="${esc(t.av)}" onerror="this.style.visibility='hidden'" loading="lazy" alt="">`:''}</span>`;
const pav=p=>`<span class="av" style="display:grid;place-items:center;font-weight:800;font-size:13px;color:#ffb612;background:#1b1b1b">R${p.round}</span>`;
const inj=s=>s?`<span class="inj" style="background:${IC[s]||'#c9971c'}">${IA[s]||esc(s)[0]}</span>`:'';
const prow=(p,slot,hl)=>{
  const sl=slot?`<span class="slot" style="color:${CL[slot]}">${slot}</span>`:'';
  if(!p)return`<div class="row">${sl}<div class="grow sub">Empty</div></div>`;
  if(p.isPick)return`<div class="row">${sl}${pav(p)}<div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub">Draft pick</div></div><div class="val">${fmt(p.v)}</div></div>`;
  return`<div class="row ${hl?'hl':''}" data-pid="${p.id}">${sl}${av(p.id)}<div class="grow"><div class="nm">${esc(p.name)}${inj(p.inj)}</div><div class="sub">${p.pos} - ${esc(p.team)}${p.age?' · '+Math.round(p.age):''}</div></div><div class="val">${fmt(p.v)}</div></div>`;
};
const seg=()=>`<div class="seg">${Object.entries(MODES).map(([k,l])=>`<button class="${(S.mode||'fringe')===k?'on':''}" data-m="${k}">${l}</button>`).join('')}</div>`;
function owners(){const m={};D.teams.forEach(t=>t.players.forEach(p=>m[p.id]=t));return m}
const total=t=>sum(t.players.map(p=>p.v))+sum(t.picks.map(p=>p.v));

/* ---------- tabs ---------- */
function tabRoster(){
  const me=D.teams.find(t=>t.mine);
  if(!me)return'<div class="card pad">Couldn’t find your team in this league.</div><button class="lnk" id="sw">Switch league / account</button>';
  const N=D.teams.length,rank=[...D.teams].sort((a,b)=>total(b)-total(a)).indexOf(me)+1,{rows,bench}=assign(me.players,D.slots);
  const hurt=me.players.filter(p=>p.inj).length,mode=S.mode||'fringe',nd=needs();
  const worst=[...nd].sort((a,b)=>b.rank-a.rank)[0],weak=nd.filter(n=>n.lab==='Need').map(n=>n.k);
  const old=me.players.filter(p=>(p.age||0)>=27&&p.v>=1000).sort((a,b)=>b.v-a.v).slice(0,3).map(p=>`${esc(p.name)} (${Math.round(p.age)})`);
  const pv=sum(me.picks.map(p=>p.v));
  const tips={
    contender:[`Biggest upgrade spot: <b>${worst.k}</b> (#${worst.rank} of ${N}).`,`Your picks are worth ${fmt(pv)} in trade value. Use them and young depth to buy proven starters.`],
    rebuild:[old.length?`Sell-high candidates: <b>${old.join(', ')}</b>.`:'No aging high-value starters to sell right now.',`Target players 24 and under plus picks. You hold ${me.picks.length} picks worth ${fmt(pv)}.`],
    fringe:[weak.length?`Weakest rooms: <b>${weak.join(', ')}</b>. Fix one without gutting the rest.`:`No glaring weakness. Biggest room to grow is <b>${worst.k}</b>.`,old.length?`Consider moving aging value before it drops: ${old.join(', ')}.`:`Look for 2-for-1 deals that turn depth into a starter.`]
  }[mode];
  return `<div class="card pad"><div class="sub">Total value (players + picks)</div><div style="font-size:30px;font-weight:800">${fmt(total(me))}</div>
  <div class="sub">Rank ${rank} of ${N} · ${D.sf?'Superflex':'1QB'} · ${D.ppr} PPR${hurt?` · <span class="warn">${hurt} injured</span>`:''}</div></div>
  <div class="sec">Your strategy</div>${seg()}
  <div class="card">${nd.map(n=>`<div class="row" style="min-height:46px"><span class="slot" style="color:${CL[n.k]};width:34px">${n.k}</span><div class="grow"><div class="bar" style="margin:0"><i style="width:${n.mine/n.max*100}%;background:${CL[n.k]}"></i></div></div><span class="sub" style="width:66px;text-align:right">#${n.rank} of ${N}</span><span class="tag" style="color:${n.lab==='Strength'?'#00ceb8':n.lab==='Need'?'#ff6b81':'#a6b4da'};width:74px;text-align:center">${n.lab}</span></div>`).join('')}
  <div style="padding:6px 0 8px">${tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div></div>
  <div class="sec">Starters</div><div class="card">${rows.map(r=>prow(r.p,r.s)).join('')}</div>
  <div class="sec">Bench</div><div class="card">${bench.map(p=>prow(p,'BN')).join('')||'<div class="row sub">Empty</div>'}</div>
  <div class="sec">Draft picks (${me.picks.length})</div><div class="card">${me.picks.map(p=>prow(p)).join('')||'<div class="row sub">No picks</div>'}</div>
  <button class="lnk" id="sw">Switch league / account</button>`;
}
function tabLeague(){
  const rk=D.teams.map(t=>({t,v:total(t)})).sort((a,b)=>b.v-a.v),mx=rk[0]?.v||1;
  return rk.map((x,i)=>`<details class="card ${x.t.mine?'mine':''}"><summary><div class="row" style="border:0"><span class="sub" style="width:18px">${i+1}</span>${tav(x.t)}<div class="grow"><div class="nm">${esc(x.t.name)}</div><div class="bar"><i style="width:${x.v/mx*100}%"></i></div></div><div class="val">${fmt(x.v)}</div></div></summary>${[...x.t.players].sort((a,b)=>b.v-a.v).map(p=>prow(p)).join('')}${x.t.picks.map(p=>prow(p)).join('')}</details>`).join('');
}
function tabValues(){return `<input id="q" placeholder="Search players or picks" value="${esc(q)}"><div class="chips">${['ALL',...POS,'PICKS'].map(p=>`<button class="chip ${filt===p?'on':''}" data-f="${p}">${p}</button>`).join('')}</div><div id="vl"></div>`}
function valList(){
  const own=owners(),mx=Math.max(...Object.values(D.vals).map(v=>v.v),1),ql=q.toLowerCase();
  let items=[];
  if(filt!=='PICKS')items=Object.entries(D.vals).map(([id,v])=>({id,name:v.n,pos:v.p,team:v.t,v:v.v,r:v.r})).filter(p=>POS.includes(p.pos)&&(filt==='ALL'||p.pos===filt));
  if(filt==='ALL'||filt==='PICKS')items=items.concat(D.gp);
  items=items.filter(p=>p.name.toLowerCase().includes(ql)).sort((a,b)=>b.v-a.v).slice(0,150);
  $('#vl').innerHTML=`<div class="card">${items.map(p=>{
    if(p.isPick)return`<div class="row"><span class="sub" style="width:26px">–</span>${pav(p)}<div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub">Draft pick · estimated league-wide value</div><div class="bar"><i style="width:${p.v/mx*100}%;background:#ffb612"></i></div></div><div class="val">${fmt(p.v)}</div></div>`;
    const o=own[p.id],s=PL[p.id]?.inj;
    return`<div class="row" data-pid="${p.id}"><span class="sub" style="width:26px">${p.r}</span>${av(p.id)}<div class="grow"><div class="nm">${esc(p.name)}${inj(s)}</div><div class="sub">${p.pos} - ${esc(PL[p.id]?.t||p.team||'FA')} · <span class="${o?.mine?'good':''}">${o?(o.mine?'You':esc(o.name)):'Unrostered'}</span></div><div class="bar"><i style="width:${p.v/mx*100}%"></i></div></div><div class="val">${fmt(p.v)}</div></div>`}).join('')||'<div class="row sub">No matches</div>'}</div>`;
}
function tabTrades(){
  const key=D.ts+'|'+(S.mode||'fringe');
  if(POOLKEY!==key){POOLKEY=key;POOL=pool();shown.clear();take()}
  const mode=S.mode||'fringe',note={contender:'Upgrades your starting lineup, often by spending picks.',rebuild:'Gets you younger players and picks for aging value.',fringe:'Improves your lineup while both sides benefit.'}[mode];
  let h=`<div class="sec" style="padding-top:4px">Your strategy</div>${seg()}<div class="sub" style="padding:0 16px;text-shadow:0 1px 4px rgba(0,0,0,.8)">${note} Values stay within about ±10%.</div>`;
  if(!PAGE.length)return h+'<div class="card pad">No fitting trades right now. Try another strategy or check back after the next update.</div>';
  h+=`<div style="padding:8px 12px 0"><button class="btn" id="newt" style="margin-top:0">↻ New suggestions</button></div>`;
  return h+PAGE.map(r=>{
    const lab=r.ratio>=1?['Slight win for you','good']:r.ratio>=.95?['Fair value','good']:['Small premium','warn'];
    return`<div class="card"><div class="row" style="border:0;min-height:52px">${tav(r.t)}<div class="grow"><div class="nm">Trade with ${esc(r.t.name)}</div></div></div>
    <div class="sub">YOU SEND</div>${r.give.map(p=>prow(p)).join('')}<div class="sub" style="padding-top:6px">YOU GET</div>${prow(r.get)}
    <div style="padding:6px 0 12px;display:flex;gap:6px;flex-wrap:wrap"><span class="tag ${lab[1]}">${lab[0]}</span>${r.mn>0?`<span class="tag">Your lineup +${fmt(r.mn)}</span>`:''}${r.tn>0?`<span class="tag">Theirs +${fmt(r.tn)}</span>`:''}${mode==='rebuild'||r.ga-r.ba>=2?`<span class="tag">Avg age ${Math.round(r.ga)} → ${Math.round(r.ba)}</span>`:''}</div></div>`}).join('');
}

/* ---------- player sheet ---------- */
function openP(id){
  const p=mk(id),own=owners()[id],m=$('#modal');
  const ht=+p.ht?`${Math.floor(p.ht/12)}'${p.ht%12}"`:'';
  const prk=p.r?Object.values(D.vals).filter(v=>v.p===p.pos&&v.r<p.r).length+1:null;
  const mates=Object.keys(PL).filter(i=>PL[i].t===p.team&&POS.includes(PL[i].p)&&(PL[i].dco!=null||PL[i].st==='Active')).map(i=>mk(i));
  const lu=p.team!=='FA'?POS.map(k=>{
    const l=mates.filter(x=>x.pos===k).sort((a,b)=>(a.dco??99)-(b.dco??99)||b.v-a.v).slice(0,{QB:2,RB:4,WR:6,TE:3}[k]);
    return l.length?`<div class="sub" style="padding:10px 0 0;color:${CL[k]};font-weight:800">${k}</div>`+l.map((x,n)=>`<div class="row ${x.id===id?'hl':''}" data-pid="${x.id}"><span class="slot sub">${n+1}</span>${av(x.id)}<div class="grow"><div class="nm">${esc(x.name)}${inj(x.inj)}</div><div class="sub">${x.num?'#'+x.num+' · ':''}${x.inj?esc(x.inj)+(x.body?' ('+esc(x.body)+')':''):'Healthy'}</div></div><div class="val">${fmt(x.v)}</div></div>`).join(''):'';
  }).join(''):'<div class="row sub">Not on an NFL roster</div>';
  const details=[p.age?'Age '+Math.round(p.age):'',ht,p.wt?p.wt+' lb':'',p.col,p.exp!=null?(p.exp?p.exp+' yrs exp':'Rookie'):''].filter(Boolean).join(' · ');
  m.innerHTML=`<div class="back" id="bk">‹ Back</div>
  <div class="hd" style="gap:14px">${av(id,1)}<div><h1 style="font-size:22px">${esc(p.name)}</h1><div class="sub">${p.pos} · ${esc(p.team)}${p.num?' · #'+p.num:''}</div><div class="sub" style="margin-top:2px">${esc(details)}</div></div></div>
  <div class="card pad" style="display:flex;justify-content:space-around;text-align:center"><div><div class="val" style="font-size:20px;text-align:center">${fmt(p.v)}</div><div class="sub">Dynasty value</div></div><div><div class="val" style="font-size:20px;text-align:center">${p.r?'#'+p.r:'–'}</div><div class="sub">Overall</div></div><div><div class="val" style="font-size:20px;text-align:center">${prk?p.pos+prk:'–'}</div><div class="sub">Position</div></div></div>
  <div class="row" style="padding:0 16px;border:0;min-height:44px">${own?tav(own):''}<div class="sub">${own?(own.mine?'On your roster':'Rostered by '+esc(own.name)):'Unrostered in your league'}</div></div>
  <div class="sec">Injury report</div><div class="card pad">${p.inj?`<div><span class="inj" style="background:${IC[p.inj]||'#c9971c'};margin:0 8px 0 0;font-size:12px">${esc(p.inj)}</span><b>${esc(p.body||'Body part not listed')}</b></div><div style="margin-top:8px;line-height:1.4">${esc(p.note||'No additional notes from Sleeper.')}</div>`:`<div class="good"><b>No injury designation</b></div><div class="sub" style="margin-top:4px">${p.st&&p.st!=='Active'?'Roster status: '+esc(p.st):'Listed as healthy and active.'}</div>`}<div class="sub" style="margin-top:8px">Source: Sleeper player data, refreshed every few hours.</div></div>
  <div class="sec">${esc(p.team)} lineup</div><div class="card">${lu}</div>`;
  m.style.display='block';m.scrollTop=0;document.body.style.overflow='hidden';
  $('#bk').onclick=closeP;
}
function closeP(){$('#modal').style.display='none';document.body.style.overflow=''}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-m]');
  if(m){S.mode=m.dataset.m;ls.set('cfg',S);render();return}
  if(e.target.closest('#newt')){take();render();scrollTo(0,0);return}
  const el=e.target.closest('[data-pid]');if(el&&D)openP(el.dataset.pid);
});

/* ---------- shell ---------- */
const ICON={roster:'M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z',league:'M4 5h16v3H4zm0 5.5h16v3H4zM4 16h16v3H4z',values:'M4 20h4V10H4zm6 0h4V4h-4zm6 0h4v-7h-4z',trades:'M7 7h11l-3-3 1.4-1.4L22 8l-5.6 5.4L15 12l3-3H7zm10 10H6l3 3-1.4 1.4L2 16l5.6-5.4L9 12l-3 3h11z'};
function render(){
  if(!D)return;
  $('#nav').style.display='flex';
  const titles={roster:'My Roster',league:'League',values:'Trade Values',trades:'Recommended Trades'};
  const body={roster:tabRoster,league:tabLeague,values:tabValues,trades:tabTrades}[tab]();
  $('#app').innerHTML=`<div class="hd">${D.lav?`<img src="https://sleepercdn.com/avatars/thumbs/${D.lav}" alt="">`:'<span class="lg"></span>'}<div class="grow"><h1>${titles[tab]}</h1><div class="sub">${esc(D.lname)} · <span id="st">${status}</span></div></div><button class="lnk" id="rf" style="padding:6px">↻</button></div>${body}`;
  $('#nav').innerHTML=Object.entries({roster:'Roster',league:'League',values:'Values',trades:'Trades'}).map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}"><svg viewBox="0 0 24 24"><path d="${ICON[k]}"/></svg>${l}</button>`).join('');
  $('#rf').onclick=refresh;
  $('#sw')&&($('#sw').onclick=()=>{S={mode:S.mode};D=null;ls.set('cfg',S);setup()});
  if(tab==='values'){valList();$('#q').oninput=e=>{q=e.target.value;valList()};
    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()})}
}
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render();scrollTo(0,0)}};

/* ---------- background field + icon ---------- */
(function(){
  let n='';[10,20,30,40,50,40,30,20,10].forEach((v,i)=>{const y=200+i*100;
    n+=`<text x="75" y="${y}" transform="rotate(-90 75 ${y})">${v}</text><text x="458" y="${y}" transform="rotate(90 458 ${y})">${v}</text>`});
  $('#bg').innerHTML=`<svg viewBox="0 0 533 1200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><pattern id="st" width="533" height="100" patternUnits="userSpaceOnUse"><rect width="533" height="50" fill="#1a5a31"/><rect y="50" width="533" height="50" fill="#14502a"/></pattern>
  <pattern id="yl" width="533" height="50" patternUnits="userSpaceOnUse"><rect width="533" height="2" fill="#fff" opacity=".6"/></pattern>
  <pattern id="hm" width="533" height="10" patternUnits="userSpaceOnUse"><rect x="195" width="12" height="2" fill="#fff" opacity=".4"/><rect x="326" width="12" height="2" fill="#fff" opacity=".4"/></pattern></defs>
  <rect width="533" height="1200" fill="url(#st)"/><rect y="100" width="533" height="1000" fill="url(#yl)"/><rect y="100" width="533" height="1000" fill="url(#hm)"/>
  <rect x="4" y="100" width="525" height="1000" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
  <rect width="533" height="100" fill="#0e0e0e"/><rect y="1100" width="533" height="100" fill="#0e0e0e"/>
  <rect x="10" y="10" width="513" height="80" fill="none" stroke="#FFB612" stroke-width="4"/><rect x="10" y="1110" width="513" height="80" fill="none" stroke="#FFB612" stroke-width="4"/>
  <g fill="#FFB612" font-family="Arial Black,Arial,sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle"><text x="266" y="52" font-size="58" letter-spacing="8">STEELERS</text><text x="266" y="52" font-size="58" letter-spacing="8" transform="rotate(180 266 600)">STEELERS</text></g>

    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
  }catch(e){}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.leagueId&&Date.now()-lastRun>60000)refresh()});
if(S.leagueId){if(D&&D.teams?.[0]?.picks)render();refresh()}else setup();
</script></body></html>
